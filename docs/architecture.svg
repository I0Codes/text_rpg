<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="920" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4f1eb"/>
      <stop offset="100%" style="stop-color:#e8e4dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <style type="text/css"><![CDATA[
      .title { font-family: "Segoe UI", system-ui, sans-serif; font-size: 22px; font-weight: 700; fill: #1a1a18; }
      .subtitle { font-family: "Segoe UI", system-ui, sans-serif; font-size: 12px; fill: #5c5a55; }
      .box { rx: 8; filter: url(#shadow); }
      .t-entry { fill: #e8f4fc; stroke: #2b6cb0; stroke-width: 1.5; }
      .t-core { fill: #eef2ff; stroke: #4c51bf; stroke-width: 1.5; }
      .t-ui { fill: #f0fff4; stroke: #2f855a; stroke-width: 1.5; }
      .t-world { fill: #fffaf0; stroke: #c05621; stroke-width: 1.5; }
      .t-domain { fill: #faf5ff; stroke: #6b46c1; stroke-width: 1.5; }
      .t-side { fill: #f7fafc; stroke: #718096; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .label { font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #1a1a18; }
      .code { font-family: "Consolas", "Cascadia Code", monospace; font-size: 11px; fill: #3d3d3a; }
      .arrow { stroke: #4a5568; stroke-width: 1.8; fill: none; marker-end: url(#m); }
      .arrow-muted { stroke: #a0aec0; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#mm); }
    ]]></style>
    <marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a5568"/>
    </marker>
    <marker id="mm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a0aec0"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <text x="460" y="36" text-anchor="middle" class="title">text_rpg / architecture</text>
  <text x="460" y="54" text-anchor="middle" class="subtitle">Module dependencies (current wiring)</text>

  <rect class="box t-entry" x="380" y="72" width="160" height="52"/>
  <text x="460" y="98" text-anchor="middle" class="label">Entry</text>
  <text x="460" y="114" text-anchor="middle" class="code">main.py</text>

  <rect class="box t-core" x="280" y="160" width="360" height="100"/>
  <text x="460" y="186" text-anchor="middle" class="label">core</text>
  <text x="295" y="208" class="code">Game: loop, location actions</text>
  <text x="295" y="224" class="code">Combat: turns, damage, items, flee</text>
  <text x="295" y="248" class="code">Uses: player, current_location, UI, CombatUI</text>

  <rect class="box t-ui" x="60" y="300" width="200" height="88"/>
  <text x="160" y="328" text-anchor="middle" class="label">ui</text>
  <text x="75" y="350" class="code">UI: status, actions, confirm</text>
  <text x="75" y="368" class="code">CombatUI: battle I/O</text>

  <rect class="box t-world" x="660" y="300" width="200" height="88"/>
  <text x="760" y="328" text-anchor="middle" class="label">world</text>
  <text x="675" y="350" class="code">Location / Forest</text>
  <text x="675" y="368" class="code">-&gt; Enemy subclasses (Goblin...)</text>

  <rect class="box t-domain" x="280" y="420" width="360" height="120"/>
  <text x="460" y="446" text-anchor="middle" class="label">entities &amp; items</text>
  <text x="295" y="468" class="code">Character: HP, level, gold</text>
  <text x="295" y="484" class="code">+ Inventory, Attributes, ExperienceManager</text>
  <text x="295" y="502" class="code">Enemy (extends Character): loot, AI</text>
  <text x="295" y="520" class="code">items: Item, Inventory</text>

  <rect class="box t-side" x="60" y="520" width="200" height="72"/>
  <text x="160" y="548" text-anchor="middle" class="label">not wired from Game</text>
  <text x="75" y="570" class="code">world/events.py</text>
  <text x="75" y="584" class="code">dice_system.py</text>

  <path class="arrow" d="M 460 124 L 460 158"/>
  <path class="arrow" d="M 320 232 L 210 298"/>
  <text x="238" y="268" class="code" font-size="10">UI / CombatUI</text>
  <path class="arrow" d="M 600 220 L 720 298"/>
  <text x="648" y="268" class="code" font-size="10">actions</text>
  <path class="arrow" d="M 760 388 L 590 425"/>
  <text x="658" y="402" class="code" font-size="10">Enemy</text>
  <path class="arrow" d="M 460 260 L 460 418"/>
  <text x="468" y="340" class="code" font-size="10">player</text>
  <path class="arrow-muted" d="M 230 520 L 400 268"/>
  <text x="268" y="388" class="code" font-size="10">not imported yet</text>
</svg>
